name: India Cybersecurity OSINT Scanner

on:
  workflow_dispatch:

  # Runs every day at 9:00 AM IST
  # 9:00 AM IST = 03:30 UTC
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: india-cyber-events-osint
  cancel-in-progress: true

jobs:
  scan:
    name: Discover Cybersecurity Events
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. Setup Python
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ------------------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install lxml

      # ------------------------------------------------------
      # 4. Test internet/public sources
      # ------------------------------------------------------
      - name: Test public sources
        run: |
          python source_test.py

      # ------------------------------------------------------
      # 5. Run event discovery + verification
      # ------------------------------------------------------
      - name: Run OSINT pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python pipeline.py
