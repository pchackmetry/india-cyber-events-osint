name: India Cybersecurity OSINT Scanner

on:
  workflow_dispatch:

  schedule:
  - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: india-cyber-events-osint
  cancel-in-progress: false

jobs:
  scan:
    name: Discover Cybersecurity Events
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test public sources
        run: |
          python source_test.py

      - name: Run OSINT pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python pipeline.py
